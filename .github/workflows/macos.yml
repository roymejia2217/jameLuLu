name: macOS build and firewall policy tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  policy-tests:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run production policy tests
        run: |
          clang -fobjc-arc -fmodules -Wall -Wextra -Werror \
            -framework Foundation -framework NetworkExtension \
            LuLu/Tests/test_jame_firewall_policy.m -o "$RUNNER_TEMP/jame-policy-tests"
          "$RUNNER_TEMP/jame-policy-tests"
          clang -fobjc-arc -fmodules -Wall -Wextra -Werror \
            -framework Foundation -framework Security \
            LuLu/Tests/test_jame_identity_policy.m -o "$RUNNER_TEMP/jame-identity-tests"
          "$RUNNER_TEMP/jame-identity-tests"
      - name: Validate real socket probe fixtures (no content filter active)
        env:
          JAME_PROBE_EXPECT: allow
        run: |
          python3 LuLu/Tests/test_socket_probe.py -v
      - name: Reject false-positive firewall PASS without active filter
        env:
          JAME_PROBE_EXPECT: block
        run: |
          # This runner has no approved Network Extension. In the negative
          # control the protected app MUST successfully connect, and the
          # block-mode harness MUST report eight FILTER BYPASS failures.
          set +e
          python3 LuLu/Tests/test_socket_probe.py -v > "$RUNNER_TEMP/socket-negative-control.log" 2>&1
          result=$?
          set -e
          if [ "$result" -eq 0 ] || ! grep -q '^FAILED (failures=8)

  unsigned-build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Validate Xcode project, schemes and entitlements
        run: |
          plutil -lint LuLu/LuLu.xcodeproj/project.pbxproj
          if grep -Fq 'findProcesses(@"LuLu")' LuLu/App/Configure.m; then
            echo "ERROR: generic LuLu process termination would affect the upstream application"
            exit 1
          fi
          if grep -Eq 'PROVISIONING_PROFILE_SPECIFIER.*LuLu (Application|Extension)' LuLu/LuLu.xcodeproj/project.pbxproj; then
            echo "ERROR: inherited upstream provisioning profile remains"
            exit 1
          fi
          plutil -lint LuLu/App/Info.plist LuLu/Extension/Info.plist
          plutil -lint LuLu/App/App.entitlements LuLu/Extension/Extension.entitlements
          xcodebuild -list -workspace lulu.xcworkspace
          bash -n DMG/createDMG.sh
          if env -u JAMELULU_DEVELOPER_ID -u JAMELULU_TEAM_ID -u JAMELULU_NOTARY_PROFILE bash DMG/createDMG.sh > "$RUNNER_TEMP/packaging-denial.txt" 2>&1; then
            echo "ERROR: release packaging did not reject missing credentials"
            exit 1
          fi
          grep -q JAMELULU_DEVELOPER_ID "$RUNNER_TEMP/packaging-denial.txt"
      - name: Compile application and system extension (unsigned)
        run: |
          xcodebuild -workspace lulu.xcworkspace -scheme LuLu \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/jamelulu-build" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Analyze app and system extension with Xcode
        run: |
          xcodebuild -workspace lulu.xcworkspace -scheme LuLu \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/jamelulu-build" \
            CODE_SIGNING_ALLOWED=NO analyze
      - name: Verify unsigned app bundle and embedded system extension
        run: |
          APP="$RUNNER_TEMP/jamelulu-build/Build/Products/Debug/jameLuLu.app"
          EXT="$APP/Contents/Library/SystemExtensions/io.github.roymejia2217.jamelulu.extension.systemextension"
          test -d "$APP" && test -d "$EXT"
          test -x "$APP/Contents/MacOS/jameLuLu"
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Contents/Info.plist")
          EXT_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$EXT/Contents/Info.plist")
          test "$APP_ID" = io.github.roymejia2217.jamelulu.app
          test "$EXT_ID" = io.github.roymejia2217.jamelulu.extension
          echo "Unsigned bundle layout verified; this does not test Network Extension activation."
      - name: Produce inspection-only debug archive
        run: |
          APP="$RUNNER_TEMP/jamelulu-build/Build/Products/Debug/jameLuLu.app"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/jameLuLu-UNSIGNED-debug.zip"
          shasum -a 256 "$RUNNER_TEMP/jameLuLu-UNSIGNED-debug.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: jameLuLu-UNSIGNED-debug
          path: ${{ runner.temp }}/jameLuLu-UNSIGNED-debug.zip
          retention-days: 7
 "$RUNNER_TEMP/socket-negative-control.log"; then
            cat "$RUNNER_TEMP/socket-negative-control.log"
            echo "ERROR: the socket probe failed to detect unfiltered traffic reliably"
            exit 1
          fi
          test "$(grep -c 'FILTER BYPASS:' "$RUNNER_TEMP/socket-negative-control.log")" -eq 8
          echo "Negative control PASS: blocked-mode cannot pass on an unfiltered runner."

  unsigned-build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Validate Xcode project, schemes and entitlements
