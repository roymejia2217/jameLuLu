name: macOS build and firewall policy tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  policy-tests:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run production policy tests
        run: |
          clang -fobjc-arc -fmodules -Wall -Wextra -Werror \
            -framework Foundation -framework NetworkExtension \
            LuLu/Tests/test_jame_firewall_policy.m -o "$RUNNER_TEMP/jame-policy-tests"
          "$RUNNER_TEMP/jame-policy-tests"
          clang -fobjc-arc -fmodules -Wall -Wextra -Werror \
            -framework Foundation \
            LuLu/Tests/test_jame_identity_policy.m -o "$RUNNER_TEMP/jame-identity-tests"
          "$RUNNER_TEMP/jame-identity-tests"

  unsigned-build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Validate Xcode project, schemes and entitlements
        run: |
          plutil -lint LuLu/LuLu.xcodeproj/project.pbxproj
          plutil -lint LuLu/App/Info.plist LuLu/Extension/Info.plist
          plutil -lint LuLu/App/App.entitlements LuLu/Extension/Extension.entitlements
          xcodebuild -list -workspace lulu.xcworkspace
      - name: Compile application and system extension (unsigned)
        run: |
          xcodebuild -workspace lulu.xcworkspace -scheme LuLu \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/jamelulu-build" \
            CODE_SIGNING_ALLOWED=NO build
